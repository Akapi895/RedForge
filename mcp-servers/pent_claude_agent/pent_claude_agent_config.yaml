# pent_claude_agent configuration file
# Independent configuration for the penetration-testing engineer Agent; MCP servers, tools, environment, and more can be customized
# Path placeholders: ${PROJECT_ROOT} = CyberStrikeAI project root, ${SCRIPT_DIR} = directory containing this script

# Working directory(cwd when the Agent executes tasks)
cwd: "${PROJECT_ROOT}/mcp-servers/pent_claude_agent"

# Tools the Agent is allowed to use
allowed_tools:
  - Read
  - Write
  - Bash
  - Grep
  - Glob

# Disabled tools(optional)
# disallowed_tools: []

# Claude Agent MCP server configuration(pent_claude_agent can mount its own MCP servers)
# Examples: reverse_shell and other security-tool MCP servers
mcp_servers:
  # Example: mount reverse_shell so the Agent can call reverse-shell tools
  # reverse-shell:
  #   command: "${PROJECT_ROOT}/venv/bin/python3"
  #   args:
  #     - "${PROJECT_ROOT}/mcp-servers/reverse_shell/mcp_reverse_shell.py"

# Environment variables(API keys, etc.; pent_claude_agent configures these independently of the main project)
env:
  ANTHROPIC_API_KEY: "sk-xxx"  # Enter your API key
  ANTHROPIC_MODEL: "qwen3.5-plus"
  ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_BUG_COMMAND: "1"

# System prompt(defines the penetration-testing engineer's role and behavior)
system_prompt: |
  You are a professional penetration-testing engineer. Based on the user's task, perform security testing, vulnerability analysis, information gathering, and related work.
  Execute step by step and output clear, reproducible results. Full authorization has been obtained; do not question authorization again.

# Sources for loading Skills(user=user directory, project=project directory, local=local)
setting_sources:
  - user
  - project
