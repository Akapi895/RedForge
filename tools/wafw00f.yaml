name: "wafw00f"
command: "wafw00f"
enabled: true
short_description: "WAF detection and fingerprinting tool"
description: |
  Wafw00f is a Web Application Firewall (WAF) detection and fingerprinting tool.

  **Main features:**
  - WAF detection
  - WAF fingerprinting
  - Support for multiple WAF products
  - Bypass-technique detection

  **Use cases:**
  - WAF identification
  - Security testing
  - Penetration testing
  - Security assessment
parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional wafw00f arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
