name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA configuration ====================
    # Configure your FOFA API key here.
    # You may also set it through the FOFA_API_KEY environment variable.
    # The tool is disabled by default and must be enabled before this MCP can be called.
    FOFA_API_KEY = ""  # Enter your FOFA API key here
    # ==================================================

    # FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse arguments from a JSON string or command-line arguments
    def parse_args():
        # Try to read JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure that sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse it as JSON
                config = json.loads(arg1)
                # Ensure that the returned value is a dictionary
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If it is not JSON, use the traditional positional-argument mode
                pass

        # Traditional positional-argument mode (backward compatible)
        # Note: api_key is not passed as an invocation argument; it is read from configuration or the environment
        # Argument positions: query=2, size=3, page=4, fields=5, full=6
        # In sys.argv, the actual positions must be adjusted because of the python3 -c "code" form
        # sys.argv[0] is '-c'; actual arguments begin at sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure that config is a dictionary
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Argument parsing error: expected a dictionary, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Obtain api_key from configuration or the environment variable
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: api_key (FOFA API key)",
                "required_config": ["api_key"],
                "note": "Enter your API key in the FOFA_API_KEY setting in this YAML file or set the FOFA_API_KEY environment variable. Obtain the key from the FOFA user center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required argument: query (search query)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="Login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request arguments
        params = {
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional arguments
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # Send the request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check for an error returned by the FOFA API
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Check whether the API key is correct and whether the query follows FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format the output
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Check the network connection or FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA cyberspace search engine with flexible query configuration"
description: |
  FOFA is a cyberspace-mapping search engine that searches Internet assets through multiple query conditions.

  **Main features:**
  - Support multiple query fields (app, title, domain, ip, port, country, city, etc.)
  - Flexible returned-field configuration
  - Paginated queries
  - Complete-data mode (`full` argument)

  **Use cases:**
  - Asset discovery and enumeration
  - Vulnerability impact-scope assessment
  - Security situational awareness
  - Threat-intelligence collection
  - Bug bounty reconnaissance

  **Query syntax:**

  **Basic queries:**
  - Enter a query directly to search title, HTML content, HTTP headers, and URL fields
  - If an expression contains multiple AND/OR relationships, enclose it in parentheses where possible, for example: `(app="Apache" || app="Nginx") && country="CN"`

  **Logical operators:**
  - `=` - Match; `=""` can query for a missing field or an empty value
  - `==` - Exact match; `==""` can query for an existing field with an empty value
  - `&&` - AND
  - `||` - OR
  - `!=` - Does not match; `!=""` can query for non-empty values
  - `*=` - Fuzzy match using `*` or `?`
  - `()` - Establish query precedence; content in parentheses has the highest priority

  **Common query-field categories:**

  **Basic:** `ip` (supports IPv4/IPv6/Class C ranges), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

  **Identification:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

  **Protocol (`type=service`):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

  **Website (`type=subdomain`):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

  **Geolocation:** `country` (supports codes and Chinese names), `region` (supports English and Chinese names; Chinese names are limited to China), `city`

  **Certificate:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.is_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

  **Time:** `after` (updated after a given time), `before` (updated before a given time)

  **Standalone IP syntax (cannot be combined with other syntax):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

  **Common query examples:**
  - `app="Apache"` - Search for Apache applications
  - `title="Login"` - Search for pages whose title contains "Login"
  - `domain="example.com"` - Search for a specific domain
  - `ip="1.1.1.1"` or `ip="220.181.111.1/24"` - Search for an IP or Class C range
  - `port="80"` - Search for assets with port 80 open
  - `country="CN"` or `country="China"` - Search for assets in China
  - `city="Beijing"` - Search for assets in Beijing
  - `app="Apache" && country="CN"` - Combined query
  - `(app="Apache" || app="Nginx") && country="CN"` - Complex query using parentheses
  - `title*="Login"` - Fuzzy title match
  - `after="2023-01-01" && before="2023-12-01"` - Time-range query

  **Detailed syntax documentation:** See the official FOFA documentation for more syntax details and component lists.


  **Notes:**
  - API calls are rate-limited; use them appropriately
  - The number of query results is limited by account permissions
  - The `full` argument requires advanced permissions
parameters:
  - name: "query"
    type: "string"
    description: |
      FOFA query statement (required)

      Search query supporting FOFA query syntax.
      Examples:
      - app="Apache"
      - title="Login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of results to return (optional)

      Number of results returned per page; default: 100.
      Valid range: 1-10000, subject to account permissions.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Page number (optional)

      Page number to return, starting at 1; default: 1.
      Used to paginate large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional)

      Fields to return, separated by commas.
      Default fields: ip,port,domain
      Available fields: host,title,ip,domain,port,protocol,country,province,city,server,icp,header,banner,body,as_number,as_organization
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to return complete data (optional)

      When true, return complete data; advanced permissions are required.
      Default: false, returning basic data.
    required: false
    position: 6
    format: "positional"
    default: false
