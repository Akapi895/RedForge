name: "radare2"
command: "r2"
enabled: true
short_description: "Binary analysis and reverse-engineering framework supporting disassembly, debugging, and scripted analysis"
description: |
  Radare2 is a complete binary-analysis and reverse-engineering framework supporting multiple architectures and file formats.

  **Main features:**
  - Disassembly and decompilation: support for multiple architectures (x86, ARM, MIPS, etc.)
  - Debugging: local and remote debugging
  - Scripting: support for r2pipe and r2 command scripts
  - Multiple file formats: ELF, PE, Mach-O, firmware, and others
  - Interactive analysis: command-line interface and visual mode
  - Automated analysis: batch and scripted analysis

  **Use cases:**
  - Binary-file analysis
  - Reverse engineering and vulnerability research
  - Malware analysis
  - Reverse-engineering challenges in CTF competitions
  - Firmware analysis
  - Exploit development

  **Notes:**
  - Use `-c` to execute commands and then exit (non-interactive mode)
  - Use `-i` to execute a script file
  - Use `-q` for quiet mode (suppress startup information)
  - Use `-A` to analyze a binary automatically
  - Use `-d` to attach to a process for debugging
parameters:
  - name: "target"
    type: "string"
    description: |
      Target file, process ID, or special value.

      **Format:**
      - File path: "/path/to/binary"
      - Process ID: "1234" (use with `-d`)
      - Special value: "-" (read from stdin), "--" (interactive mode), "=" (read from an environment variable)

      **Example values:**
      - Binary file: "/tmp/vulnerable"
      - Process debugging: "1234" (with `-d`)
      - From stdin: "-"

      **Notes:**
      - This parameter is required and cannot be empty
      - When specifying a process ID, also use `-d`
      - Radare2 requires the file path to be the final argument, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      Radare2 commands to execute. This may be one command or multiple semicolon-delimited commands.

      **Format:**
      - Single command: "aaa" (automatic analysis)
      - Multiple commands: "aaa; pdf @main; VV" (analyze, disassemble the main function, and enter visual mode)

      **Common commands:**
      - "aaa": Automatically analyze all functions
      - "afl": List all functions
      - "pdf @main": Disassemble the main function
      - "px 64": Display 64 bytes in hexadecimal
      - "VV": Enter visual mode
      - "i": Display file information
      - "iz": Display strings

      **Example values:**
      - "aaa" (automatic analysis)
      - "aaa; pdf @main" (analyze and disassemble the main function)
      - "i; iz" (display information and strings)

      **Notes:**
      - Separate multiple commands with semicolons (`;`)
      - The program exits after executing the commands (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      Path to a script file to execute. The script contains one Radare2 command per line.

      **Format:**
      - Script file path: "/path/to/script.r2"

      **Example values:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - Commands in the script file are executed in order
      - The program exits after the script finishes
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      Specify the target architecture.

      **Common architectures:**
      - "x86": 32-bit x86
      - "x86_64": 64-bit x86
      - "arm": ARM architecture
      - "arm64": ARM64 architecture
      - "mips": MIPS architecture
      - "ppc": PowerPC architecture

      **Example values:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - When omitted, Radare2 attempts automatic detection
      - Some architectures may require additional configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      Specify the target bit width (16, 32, or 64).

      **Example values:**
      - 16 (16-bit)
      - 32 (32-bit)
      - 64 (64-bit)

      **Notes:**
      - Usually used with `-a`
      - When omitted, Radare2 attempts automatic detection
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      Analyze the binary automatically. Equivalent to executing the "aaa" command.

      **Use cases:**
      - Rapid binary analysis
      - Batch analysis

      **Notes:**
      - When enabled, all functions are analyzed automatically
      - This may take a long time
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      Debugging mode. Can attach to a process or debug a file.

      **Use cases:**
      - Attach to a running process
      - Debug a binary file

      **Notes:**
      - Appropriate permissions are required
      - If target is a process ID, this option must be enabled
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      Quiet mode. Suppresses startup information and prompts.

      **Use cases:**
      - Scripted use
      - Batch analysis
      - Automated tool invocation

      **Notes:**
      - Suitable for non-interactive use
      - Reduces output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      Set the starting address. This may be a hexadecimal address or an expression.

      **Format:**
      - Hexadecimal: "0x400000"
      - Expression: "main+0x10"

      **Example values:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - The address may be hexadecimal or a symbol name
      - Used to begin analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      Set the base address used as the load address.

      **Format:**
      - Hexadecimal address: "0x400000"

      **Example values:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - Specifies the binary file's load address
      - Commonly used when analyzing firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      Set configuration variables in key=value format.

      **Format:**
      - "key=value"
      - Separate multiple variables with spaces: "asm.arch=x86 asm.bits=32"

      **Example values:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - Used to set Radare2 configuration variables
      - Separate multiple variables with spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      Load or save a project file.

      **Format:**
      - Project file path: "/path/to/project.r2"

      **Example values:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - Project files preserve analysis state and configuration
      - They can restore a previous analysis
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Radare2 arguments. Used to pass Radare2 options not defined in the parameter list.

      **Available options:**
      - "-C": Force colored output
      - "-f": Force the file to open even if the format does not match
      - "-L": List supported plugins
      - "-M": Enable write mode
      - "-n": Do not load configuration files
      - "-N": Do not execute scripts
      - "-S": Start in debugging mode
      - "-t": Use threaded mode
      - "-u": Use the Unicorn engine
      - "-v": Display version information
      - "-w": Write mode
      - "-z": Scan for strings
      - "-X": Execute an r2pipe script
      - "-P patch": Apply a patch
      - "-m maddr": Map an address

      **Example values:**
      - "-w" (write mode)
      - "-n" (do not load configuration files)
      - "-M" (enable write mode)
      - "-z" (scan for strings)

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
