name: "dirsearch"
command: "dirsearch"
enabled: true
short_description: "Advanced directory and file discovery tool"
description: |
  Dirsearch is an advanced Web content scanner for discovering directories and files.

  **Main features:**
  - Fast directory and file discovery
  - Multithreading support
  - Recursive scanning
  - Extension filtering

  **Use cases:**
  - Web application security testing
  - Directory enumeration
  - File discovery
  - Penetration testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "extensions"
    type: "string"
    description: "File extensions(comma-separated)"
    required: false
    flag: "-e"
    format: "flag"
    default: "php,html,js,txt,xml,json"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 30
  - name: "recursive"
    type: "bool"
    description: "Enable recursive scanning"
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional dirsearch arguments. Use this to pass dirsearch options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
