name: "xsser"
command: "xsser"
enabled: true
short_description: "XSS vulnerability testing tool"
description: |
  XSSer is an automated XSS vulnerability testing tool.

  **Main features:**
  - XSS vulnerability detection
  - Multiple XSS techniques
  - Automated testing
  - Report generation

  **Use cases:**
  - XSS vulnerability testing
  - Web application security testing
  - Penetration testing
  - Vulnerability validation
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "params"
    type: "string"
    description: "Parameter to test"
    required: false
    flag: "--Fp"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional XSSer arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
