name: "rustscan"
command: "rustscan"
enabled: true
short_description: "Ultra-fast port scanning (Rust) with optional greppable output, batching, and script levels"
description: |
  RustScan 2.x: rapid port discovery with optional Nmap script execution.

  **Correspondence with `rustscan -h`:**
  - `-a` / `--addresses`: list of scan targets (comma-delimited or a file)
  - `-p`: comma-delimited ports; `-r`: port range in `start-end` form (use one or combine with `-p` as permitted by the CLI)
  - `-g` / `--greppable`: output ports only for easy use with grep or pipelines
  - `--scripts`: the **official default is default** (runs Nmap); set it to **none** for faster port discovery only
  - `-b` batch size, `-t` timeout, `--scan-order`, and similar options fine-tune speed and ordering

  **Usage recommendations:**
  - For a fast port scan without Nmap, set `scripts` to `none` and add `-g` if needed
  - For service identification or scripts, use `default` or `custom` and ensure Nmap is installed locally
parameters:
  # -a, --addresses
  - name: "target"
    type: "string"
    description: |
      Corresponds to `-a`: comma-delimited CIDRs, IPs, or hostnames; may also be a path to a newline-delimited/list file.
      Examples: `192.168.1.1`, `10.0.0.1,10.0.0.2`, `192.168.0.0/24`
    required: true
    flag: "-a"
    format: "flag"
  - name: "ports"
    # -p, --ports; use range (-r) for ranges, and do not put 1-1000 in ports

    type: "string"
    description: |
      Ports to scan, as a comma-delimited list **only**; corresponds to `-p`.
      Examples: `22,80,443`, `80,443,8080`.
      For a range such as `1-1000`, use the **range** parameter (`-r`) instead of this parameter.
    required: false
    flag: "-p"
    format: "flag"
  - name: "range"
    # -r, --range (use instead of the ports list, or combine as described by the official documentation)

    type: "string"
    description: |
      Port range in start-end format; corresponds to `-r`.
      Examples: `1-1000`, `1-65535` (an all-port scan is very slow).
      For discrete ports such as `22,80,443`, use **ports** (`-p`) instead of this parameter.
    required: false
    flag: "-r"
    format: "flag"
  - name: "ulimit"
    # -u, --ulimit

    type: "int"
    description: "Raise the ulimit used for scanning; adjust according to the system's file-descriptor limit"
    required: false
    flag: "-u"
    format: "flag"
    default: 5000
  - name: "scripts"
    # --scripts: none | default | custom (CLI default: default)

    type: "string"
    description: |
      Script level; **must** be passed as a string, not true/false.
      - **none**: do not run Nmap; port discovery only (fastest)
      - **default**: matches RustScan's official default and invokes Nmap
      - **custom**: custom scripts, often used together with additional_args
    required: false
    flag: "--scripts"
    format: "flag"
    default: "none"
    options:
      - "none"
      - "default"
      - "custom"
  - name: "greppable"
    # -g, --greppable: port list only, without Nmap output

    type: "bool"
    description: "Greppable mode: output ports only, suitable for script parsing or writing to a file"
    required: false
    flag: "-g"
    format: "flag"
    default: false
  - name: "batch_size"
    # -b, --batch-size [default: 4500]

    type: "int"
    description: "Number of concurrent ports per batch; larger is faster but constrained by the OS open-file limit. Official default: 4500"
    required: false
    flag: "-b"
    format: "flag"
  - name: "timeout_ms"
    # -t, --timeout ms [default: 1500]

    type: "int"
    description: "Per-port timeout in milliseconds. Official default: 1500"
    required: false
    flag: "-t"
    format: "flag"
  - name: "scan_order"
    # --scan-order serial | random [default: serial]

    type: "string"
    description: "Scan order: serial for ascending order; random for randomized order"
    required: false
    flag: "--scan-order"
    format: "flag"
    options:
      - "serial"
      - "random"
  - name: "top_ports"
    # --top: top 1000 ports

    type: "bool"
    description: "Use the built-in top 1000 ports (equivalent to passing `--top`)"
    required: false
    flag: "--top"
    format: "flag"
    default: false
  - name: "exclude_ports"
    # -e, --exclude-ports

    type: "string"
    description: "Ports to exclude, comma-delimited. Example: `80,443`"
    required: false
    flag: "-e"
    format: "flag"
  - name: "exclude_addresses"
    # -x, --exclude-addresses

    type: "string"
    description: "Addresses to exclude as comma-delimited CIDRs, IPs, or hosts"
    required: false
    flag: "-x"
    format: "flag"
  - name: "tries"
    # --tries [default: 1]

    type: "int"
    description: "Number of retries before declaring a port closed; 0 is corrected to 1"
    required: false
    flag: "--tries"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Options not listed above can be entered here, separated by spaces.
      Examples: `--no-banner`, `--udp`, `-n` (ignore the configuration file), `-c /path/config.toml`, `--resolver 8.8.8.8`
    required: false
    format: "positional"
