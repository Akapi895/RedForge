name: "gau"
command: "gau"
enabled: true
short_description: "Retrieve all URLs from multiple data sources"
description: |
  Gau (Get All URLs) retrieves all URLs for a target domain from multiple data sources.

  **Main features:**
  - Retrieve URLs from the Wayback Machine
  - Retrieve URLs from Common Crawl
  - Retrieve URLs from OTX
  - Retrieve URLs from URLScan

  **Use cases:**
  - URL discovery
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "Data sources (wayback,commoncrawl,otx,urlscan)"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "Include subdomains"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Gau arguments for options not defined in the parameter list.

      **Example values:**
      - "--o output.txt": output to a file
      - "--threads 4": number of threads
      - "--blacklist ttf,woff,svg,png": extensions to blacklist

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
