name: "prowler"
command: "prowler"
enabled: true
short_description: "Cloud security assessment tool (AWS, Azure, GCP)"
description: |
  Prowler is a comprehensive cloud security assessment tool that supports AWS, Azure, and GCP.

  **Main features:**
  - Cloud security assessment
  - Compliance checks
  - Security best-practice checks
  - Multiple output formats

  **Use cases:**
  - Cloud security audits
  - Compliance checks
  - Security assessments
  - Cloud configuration audits
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider (aws, azure, gcp)"
    required: false
    default: "aws"
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "AWS profile"
    required: false
    flag: "-p"
    format: "flag"
    default: "default"
  - name: "region"
    type: "string"
    description: "Specific region to scan"
    required: false
    flag: "-r"
    format: "flag"
  - name: "checks"
    type: "string"
    description: "Specific checks to run"
    required: false
    flag: "-c"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, csv, html)"
    required: false
    flag: "-M"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Prowler arguments. Used to pass Prowler options not defined in the parameter list.

      **Example values:**
      - Add common argument examples according to the tool's features

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
