name: "objdump"
command: "objdump"
enabled: true
short_description: "Binary disassembly tool"
description: |
  Objdump is part of GNU binutils and is used to disassemble binary files.

  **Main features:**
  - Disassembly
  - Symbol table display
  - Section information display
  - Support for multiple architectures

  **Use cases:**
  - Binary analysis
  - Reverse engineering
  - Program comprehension
  - Debugging assistance
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble the binary file"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional objdump arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
