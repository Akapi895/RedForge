name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used in the tool list to reduce token usage)

short_description: "Automated SQL injection detection and exploitation tool"
# Detailed tool description

description: |
  An automated SQL injection detection and exploitation tool used to discover and exploit SQL injection vulnerabilities.

  **Main features:**
  - Automatically detect SQL injection vulnerabilities
  - Support multiple database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatically extract database information (tables, columns, and data)
  - Support multiple injection techniques (boolean-based blind, time-based blind, UNION queries, etc.)
  - Support advanced capabilities such as file upload/download and command execution

  **Use cases:**
  - Web application security testing
  - SQL injection vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability validation

  **Notes:**
  - Use only for authorized security testing
  - Some operations may affect the target system
  - Validate in a test environment first
  - Use `--batch` to avoid interactive prompts
# Parameter definitions

parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL containing a parameter that may be vulnerable to SQL injection.

      **Format requirements:**
      - A complete URL including the scheme (http:// or https://)
      - Must contain a query parameter; mark the injection point in its value with `*`
      - Alternatively, provide the complete URL and sqlmap will detect parameters automatically

      **Example values:**
      - Marked injection point: "http://example.com/page?id=1*"
      - Complete URL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (use with the data parameter)
      - Cookie injection: "http://example.com/page" (use with the cookie parameter)

      **Notes:**
      - The URL must be reachable
      - Ensure the URL is correctly formatted and includes a scheme prefix
      - For POST requests, also provide the data parameter
      - This parameter is required and cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode; automatically selects default options without user input.

      **Use cases:**
      - Automated testing scripts
      - Batch scanning
      - Avoiding interactive prompts

      **Notes:**
      - Keeping this set to true is recommended to prevent the tool from waiting for user input
      - Default: true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Test level from 1 to 5. Higher levels provide more comprehensive testing but take longer.

      **Level details:**
      - Level 1: Basic testing; fast but may miss vulnerabilities
      - Level 2: Default level, balancing speed and coverage
      - Level 3: Extended testing with more comprehensive detection
      - Level 4: In-depth testing with more payloads
      - Level 5: Most comprehensive testing, including all known techniques

      **Recommendations:**
      - Use 1-2 for quick scans
      - Use 3 for routine testing (default)
      - Use 4-5 for in-depth testing

      **Notes:**
      - Higher levels send more requests and may be blocked by a WAF
      - Default: 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST data string used for SQL injection detection in POST requests.

      **Format:**
      - Form-data format, for example: "username=admin&password=123"
      - JSON format, for example: '{"username":"admin","password":"123"}'

      **Notes:**
      - Provide this parameter when the URL uses the POST method
      - Mark the injection point in a parameter value with `*`
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string used for Cookie injection detection.

      **Format:**
      - Standard Cookie format, for example: "sessionid=abc123; user=admin"

      **Notes:**
      - Provide this parameter when testing for Cookie injection
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional SQLMap arguments. Used to pass SQLMap options not defined in the parameter list.

      **Example values:**
      - "--dbs": List all databases
      - "--tables -D database": List tables in the specified database
      - "--dump -D database -T table": Dump table data
      - "--os-shell": Obtain an operating-system shell
      - "--risk 2": Risk level (1-3)
      - "--threads 10": Number of concurrent threads
      - "--tamper space2comment": Use a tamper script to bypass a WAF

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
