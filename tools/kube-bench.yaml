name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "CIS Kubernetes benchmark checking tool"
description: |
  Kube-bench checks whether Kubernetes clusters comply with the CIS Kubernetes Benchmark.

  **Main features:**
  - CIS benchmark checks
  - Support for multiple targets (master, node, etcd, policies)
  - Detailed reports
  - Configuration validation

  **Use cases:**
  - Kubernetes compliance checks
  - Security configuration audits
  - CIS benchmark validation
  - Security assessment
parameters:
  - name: "targets"
    type: "string"
    description: "Target to check (master, node, etcd, policies)"
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Kubernetes version"
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "Configuration directory"
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-bench arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
