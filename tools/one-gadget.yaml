name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "Tool for finding one-shot RCE gadgets in libc"
description: |
  One-gadget finds one-shot RCE gadgets in libc.

  **Main features:**
  - One-shot gadget search
  - Constraint-level checking
  - Support for multiple libc versions

  **Use cases:**
  - CTF challenges
  - Exploit development
  - ROP-chain simplification
  - Security research
parameters:
  - name: "libc_path"
    type: "string"
    description: "Path to the libc binary"
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "Constraint level(0, 1, 2)"
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: |
      Additional one-gadget arguments. Use this to pass one-gadget options not defined in the parameter list.

      **Example values:**
      - Add commonly used arguments according to the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
