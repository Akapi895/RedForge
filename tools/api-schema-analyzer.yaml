name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "API schema analysis tool for identifying potential security issues"
description: |
  Calls `spectral lint` to statically analyze OpenAPI/Swagger/GraphQL schemas, with support for custom rule sets or output formats.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API schema file or URL(target passed to spectral lint)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Spectral arguments, such as `--ruleset`, `--format`, and `--fail-severity`.
    required: false
    format: "positional"
