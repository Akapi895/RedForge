name: "bloodhound"
command: "bloodhound-python"
enabled: true
short_description: "Active Directory attack-path analysis and visualization tool"
description: |
  BloodHound is an Active Directory attack-path analysis and visualization tool that collects domain information and analyzes attack paths.

  **Main features:**
  - Domain information collection
  - Attack-path analysis
  - Permission-relationship visualization
  - Shortest attack-path calculation
  - High-risk path identification

  **Use cases:**
  - Active Directory security assessment
  - Post-exploitation testing
  - Domain-environment auditing
  - Red-team exercises

  **Notes:**
  - Domain-user credentials are required
  - Neo4j database support is required
  - Collection may take a considerable amount of time
  - Use in an authorized environment
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: false
    flag: "-d"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Domain username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Domain-user password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "collection_method"
    type: "string"
    description: "Collection mode(All, ACL, DCOM, LocalAdmin, RDP, etc.)"
    required: false
    default: "All"
    flag: "-c"
    format: "flag"
  - name: "dc"
    type: "string"
    description: "Domain-controller IP address"
    required: false
    flag: "-dc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional BloodHound arguments. Use this to pass BloodHound options not defined in the parameter list.

      **Example values:**
      - Add commonly used arguments according to the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
