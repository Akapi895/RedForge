name: "dalfox"
command: "dalfox"
# dalfox v2+ uses subcommands; single-target mode is `dalfox url <target>` and root-level -u is no longer supported
args:
  - "url"
enabled: true
short_description: "Advanced XSS vulnerability scanner"
description: |
  Dalfox is an advanced XSS vulnerability scanner supporting multiple XSS detection techniques.

  **Main features:**
  - XSS vulnerability detection
  - Blind XSS testing
  - DOM mining
  - Dictionary mining

  **Use cases:**
  - XSS vulnerability testing
  - Web application security testing
  - Bug bounty reconnaissance
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL. dalfox single-target mode uses the url subcommand; this is passed as the first positional argument after url.
      Equivalent CLI example: dalfox url "http://target/page?q=test"
    required: true
    position: 0
    format: "positional"
  - name: "pipe_mode"
    type: "bool"
    description: "Use piped input mode"
    required: false
    flag: "--pipe"
    format: "flag"
    default: false
  - name: "blind"
    type: "string"
    description: "Blind XSS callback address(e.g. Burp Collaborator URL)"
    required: false
    flag: "--blind"
    format: "flag"
  - name: "mining_dom"
    type: "bool"
    description: "Enable DOM mining"
    required: false
    flag: "--mining-dom"
    format: "flag"
    default: true
  - name: "mining_dict"
    type: "bool"
    description: "Enable dictionary mining"
    required: false
    flag: "--mining-dict"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional dalfox arguments. Use this to pass dalfox options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
