name: "ropper"
command: "ropper"
enabled: true
short_description: "Advanced ROP/JOP gadget search tool"
description: |
  Ropper is an advanced ROP/JOP gadget search tool for exploit development.

  **Main features:**
  - ROP/JOP gadget search
  - Gadget quality assessment
  - Support for multiple architectures
  - Exploit-chain generation

  **Use cases:**
  - Exploit development
  - ROP chain construction
  - Binary analysis
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    flag: "--file"
    format: "flag"
  - name: "gadget_type"
    type: "string"
    description: "Gadget type (rop, jop, sys, all)"
    required: false
    flag: "--type"
    format: "flag"
    default: "rop"
  - name: "quality"
    type: "int"
    description: "Gadget quality level (1-5)"
    required: false
    flag: "--quality"
    format: "flag"
    default: 1
  - name: "arch"
    type: "string"
    description: "Target architecture (x86, x86_64, arm, etc.)"
    required: false
    flag: "--arch"
    format: "flag"
  - name: "search_string"
    type: "string"
    description: "Specific gadget pattern to search for"
    required: false
    flag: "--search"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Ropper arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
