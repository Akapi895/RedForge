name: "gdb"
command: "gdb"
enabled: true
short_description: "GNU debugger for binary analysis and debugging"
description: |
  GDB is the GNU debugger for debugging and analyzing binary programs.

  **Main features:**
  - Program debugging
  - Memory analysis
  - Disassembly
  - Breakpoint setting

  **Use cases:**
  - Binary analysis
  - Vulnerability research
  - Reverse engineering
  - Program debugging
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "commands"
    type: "string"
    description: "GDB commands to execute(semicolon-separated)"
    required: false
    flag: "-ex"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "GDB script file path"
    required: false
    flag: "-x"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional gdb arguments. Use this to pass gdb options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
