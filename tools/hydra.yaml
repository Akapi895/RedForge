name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password brute-force tool supporting multiple protocols and services"
description: |
  Hydra is a network-login password brute-force tool supporting many protocols, including SSH, FTP, HTTP, and SMB.

  **Invocation requirements (read carefully):**
  - A **username source** is required: provide at least one of `username` (-l) or `username_file` (-L)
  - A **password source** is required: provide at least one of `password` (-p), `password_file` (-P), or `-C` (through `additional_args`)
  - **Start with a small wordlist** (dozens to hundreds of entries); confirm that the target is reachable before expanding it. Do not use extremely large wordlists such as rockyou by default
  - Enabled by default: stop after the first match (-f), four parallel tasks (-t), and ignore restore files (-I); set `output_file` for long-running tasks

  **CLI order:** `hydra [options] <target> <service>` (this tool assembles arguments in that order; do not place the target before the options)

  **Use cases:** Weak-password detection and password-strength assessment in authorized environments

  **Caution:** Use only against authorized targets. For unresponsive targets, reduce `wait_time` or use a smaller wordlist to avoid prolonged hangs.
parameters:
  - name: "username"
    type: "string"
    description: "Single username (-l); provide at least this or username_file"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username wordlist file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password wordlist file (-P); use a small wordlist for the initial test"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit immediately after finding one valid credential pair (-f; default: true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH and similar services, and is the default"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response from each connection (-w); default: 16 (below Hydra's default of 32 to reduce apparent hangs)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections for each thread (-W); default: 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to a file (-o); recommended for long-running tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must come after the options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional arguments (such as -s for a port, -S for SSL, -m for module options, or -C for a login:pass file), appended to the end of the command"
    required: false
    format: "positional"
