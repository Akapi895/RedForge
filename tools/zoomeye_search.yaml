name: "zoomeye_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== ZoomEye configuration ====================
    # Configure your ZoomEye account information here.
    # You may also set it through the ZOOMEYE_API_KEY environment variable.
    # The tool is disabled by default and must be enabled before this MCP can be called.
    ZOOMEYE_API_KEY = ""  # Enter your ZoomEye API key here
    # ==================================================

    # ZoomEye API base URL
    base_url = "https://api.zoomeye.ai/v2/search"

    # Parse arguments from a JSON string or command-line arguments
    def parse_args():
        # Try to read JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure that sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse it as JSON
                config = json.loads(arg1)
                # Ensure that the returned value is a dictionary
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If it is not JSON, use the traditional positional-argument mode
                pass

        # Traditional positional-argument mode (backward compatible)
        # Argument positions: query=1, page=2, pagesize=3, fields=4, sub_type=5
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['page'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['pagesize'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            config['sub_type'] = str(sys.argv[5])
        return config

    try:
        config = parse_args()

        # Ensure that config is a dictionary
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Argument parsing error: expected a dictionary, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Obtain api_key from configuration or the environment variable
        api_key = os.getenv('ZOOMEYE_API_KEY', ZOOMEYE_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing ZoomEye configuration: api_key (ZoomEye API key)",
                "required_config": ["api_key"],
                "note": "Enter your API key in the ZOOMEYE_API_KEY setting in this YAML file or set the ZOOMEYE_API_KEY environment variable. Obtain the key from the ZoomEye user center: https://www.zoomeye.ai/user"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query)",
                "required_params": ["query"],
                "examples": [
                    'app:"Apache"',
                    'title:"Login"',
                    'domain:"example.com"',
                    'ip:"1.1.1.1"',
                    'port:80',
                    'country:"CN"',
                    'city:"Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request parameters (the ZoomEye API uses POST with parameters in the request body)
        # The ZoomEye API uses the qbase64 parameter (a Base64-encoded query)
        data = {
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    data['page'] = page
            except (ValueError, TypeError):
                pass

        if 'pagesize' in config and config['pagesize'] is not None:
            try:
                pagesize = int(config['pagesize'])
                if pagesize > 0 and pagesize <= 10000:
                    data['pagesize'] = pagesize
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            data['fields'] = str(config['fields']).strip()

        if 'sub_type' in config and config['sub_type']:
            sub_type = str(config['sub_type']).strip().lower()
            if sub_type in ('v4', 'v6', 'web'):
                data['sub_type'] = sub_type

        if 'facets' in config and config['facets']:
            data['facets'] = str(config['facets']).strip()

        if 'ignore_cache' in config and config['ignore_cache'] is not None:
            ignore_cache_val = config['ignore_cache']
            if isinstance(ignore_cache_val, bool):
                data['ignore_cache'] = ignore_cache_val
            elif isinstance(ignore_cache_val, str):
                data['ignore_cache'] = ignore_cache_val.lower() in ('true', '1', 'yes')
            elif isinstance(ignore_cache_val, (int, float)):
                data['ignore_cache'] = ignore_cache_val != 0

        # Set request headers (the ZoomEye API uses API-key authentication)
        headers = {
            'API-KEY': api_key,
            'Content-Type': 'application/json'
        }

        # Send the request (the ZoomEye API uses POST)
        try:
            response = requests.post(base_url, json=data, headers=headers, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check for an error returned by the ZoomEye API
            # The ZoomEye API returns code 60000 on success
            if result_data.get('code') != 60000:
                error_code = result_data.get('code', 'unknown')
                error_msg = result_data.get('message', 'unknown error')
                error_result = {
                    "status": "error",
                    "message": f"ZoomEye API error: {error_msg}",
                    "error_code": error_code,
                    "suggestion": "Check whether the API key is correct and whether the query follows ZoomEye syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format the output
            # The ZoomEye API returns results in the data field
            data_list = result_data.get('data', [])
            if isinstance(data_list, dict):
                nested = None
                for key in ('data', 'items', 'matches', 'results', 'list', 'records'):
                    value = data_list.get(key)
                    if isinstance(value, list):
                        nested = value
                        break
                data_list = nested if nested is not None else []
            if not isinstance(data_list, list):
                data_list = []
            output = {
                "status": "success",
                "query": result_data.get('query', query),
                "total": result_data.get('total', 0),
                "page": result_data.get('page', 1),
                "pagesize": result_data.get('pagesize', 10),
                "results_count": len(data_list),
                "results": data_list,
                "message": f"Successfully retrieved {len(data_list)} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Check the network connection or ZoomEye API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "ZoomEye cyberspace search engine with flexible query-parameter configuration"
description: |
  ZoomEye is a cyberspace-mapping search engine that searches Internet assets through multiple query conditions.

  **Main features:**
  - Support multiple query fields (app, title, domain, ip, port, country, city, etc.)
  - Flexible returned-field configuration
  - Paginated queries (up to 10,000 entries per page)
  - IPv4, IPv6, and web-asset searches
  - Faceted-statistics queries
  - Rich asset information in results

  **Use cases:**
  - Asset discovery and enumeration
  - Vulnerability impact-scope assessment
  - Security situational awareness
  - Threat-intelligence collection
  - Bug bounty reconnaissance

  **Query syntax:**

  **Search rules:**
  - The search scope includes devices (IPv4 and IPv6) and websites (domain names)
  - Search strings are case-insensitive and enclosed in quotation marks (for example, `"Cisco System"`)
  - Use `==` for an exact, case-sensitive match

  **Logical operators:**
  - `=` - Search for assets containing a keyword, such as `title="knownsec"`
  - `==` - Exact, case-sensitive match, such as `title=="knownsec"`
  - `||` - OR, such as `service="ssh" || service="http"`
  - `&&` - AND, such as `device="router" && after="2020-01-01"`
  - `!=` - NOT, such as `country="US" && subdivisions!="new york"`
  - `()` - Precedence grouping, such as `(country="US" && port!=80) || (country="US" && title!="404 Not Found")`
  - `*` - Fuzzy search, such as `title="*google"`

  **Syntax keywords:**

  **Geolocation:** `country="CN"`, `subdivisions="beijing"`, `city="changsha"`

  **IP/domain:** `ip="8.8.8.8"`, `cidr="52.2.254.36/24"`, `domain="baidu.com"`, `hostname="google.com"`, `port=80`, `asn=42893`, `org="Stanford University"`, `isp="China Mobile"`

  **Fingerprinting:** `app="Cisco ASA SSL VPN"`, `service="ssh"`, `device="router"`, `os="RouterOS"`, `title="Cisco"`, `product="Cisco"`, `protocol="TCP"`, `industry="government"`, `is_honeypot="True"`

  **Certificate search:** `ssl="google"`, `ssl.cert.fingerprint="..."`, `ssl.jarm="..."`, `ssl.ja3s=...`, `ssl.version="TLSv1.3"`, `ssl.cert.subject.cn="example.com"`

  **HTTP-related:** `banner="FTP"`, `http.header="http"`, `http.header_hash="..."`, `http.header.server="Nginx"`, `http.header.status_code="200"`, `http.body="document"`, `http.body_hash="..."`

  **Time search:** `after="2020-01-01"`, `before="2020-01-01"` (must be combined with another condition)

  **Other:** `dig="baidu.com 220.181.38.148"`, `iconhash="f3418a443e7d841097c714d69ec4bcb8"`, `filehash="0b5ce08db7fb8fffe4e14d05588d49d9"`, `is_ipv4=true`, `is_ipv6=true`, `is_domain=true`

  **Query examples:**
  - `port=80 && service="http"` - Search for network devices running HTTP on port 80
  - `city=nagoya && port=443 && service=ssl` - Search for devices in Nagoya running SSL on port 443
  - `country=us && os=windows` - Search for devices in the United States running Windows
  - `app="Microsoft NTP"` - Search for devices running the Microsoft NTP application
  - `city=tokyo && device=webcam` - Search for webcams in Tokyo
  - `after="2020-01-01" && port=50050` - Search for assets on port 50050 indexed after 2020-01-01
  - `os=linux && port=22 && country=PL` - Search for Linux assets on port 22 in Poland
  - `service=ftp && hostname=example` - Search for FTP services whose hostname is example
  - `http.body="Knownsec"` - Search for assets whose body contains "Knownsec"

  **Notes:**
  - API calls are rate-limited; use them appropriately
  - The number of query results is limited by account permissions
  - A valid ZoomEye API key is required
parameters:
  - name: "query"
    type: "string"
    description: |
      ZoomEye query (required)

      Search query supporting ZoomEye syntax. Enclose strings in quotation marks and join conditions with logical operators.
      Examples:
      - app="Apache"
      - title="Login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port=80
      - country="CN"
      - app="Apache" && country="CN"
      - service="ssh" || service="http"
      - port=80 && service="http"
    required: true
    position: 1
    format: "positional"
  - name: "page"
    type: "int"
    description: |
      Page number (optional)

      Page number to return, starting at 1; default: 1.
      Used to paginate large result sets.
    required: false
    position: 2
    format: "positional"
    default: 1
  - name: "pagesize"
    type: "int"
    description: |
      Results per page (optional)

      Number of results returned per page; default: 10.
      Valid range: 1-10000, subject to account permissions.
    required: false
    position: 3
    format: "positional"
    default: 5
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional)

      Fields to return, separated by commas.
      Default fields: ip,port,domain,update_time
      Available fields: ip,port,domain,url,hostname,os,service,title,version,device,rdns,product,header,body,banner,update_time,country,province,city,isp,organization,asn,protocol,ssl,ssl.jarm,ssl.ja3s, etc.
    required: false
    position: 4
    format: "positional"
    default: "ip,port,domain,update_time"
  - name: "sub_type"
    type: "string"
    description: |
      Data type (optional)

      Specifies the type of data to search.
      Available values: v4 (IPv4 devices, default), v6 (IPv6 devices), web (website assets)
    required: false
    position: 5
    format: "positional"
    default: "v4"
  - name: "facets"
    type: "string"
    description: |
      Facets (optional)

      Fields to aggregate, separated by commas.
      Supported: country, subdivisions, city, product, service, device, os, port
    required: false
    position: 6
    format: "positional"
  - name: "ignore_cache"
    type: "bool"
    description: |
      Whether to ignore the cache (optional)

      When true, ignore the cache and retrieve the latest data.
      Default: false; available to Professional-tier and higher users.
    required: false
    position: 7
    format: "positional"
    default: false
