name: "nmap"
command: "nmap"
# Default: TCP connect scan + version detection + default NSE scripts (works without root)

args: ["-sT", "-sV", "-sC"]
enabled: true
short_description: "Network scanning: ports/services/scripts; optional timing, custom NSE, and OS detection (requires root)"
description: |
  Network mapping and port scanning.

  **Default behavior (only target/ports need to be provided):**
  - `-sT` TCP connect scan (does not require root)
  - `-sV` Version detection
  - `-sC` Default NSE scripts

  **Optional enhancements:**
  - `timing`: `-T0` through `-T5` timing templates
  - `nse_scripts`: custom scripts via `--script` (such as `vuln` or `http-*`)
  - `os_detection`: `-O` **requires root**; otherwise nmap will quit
  - `aggressive`: `-A` **requires root** (includes OS detection)
  - `scan_type`: when provided, it **completely replaces** the default `-sT -sV -sC`; include every option you need (such as `-sT -sV`)

  **Notes:**
  - `-sS` SYN scanning requires root; without root, use the default or `-sT`
  - Scanning all ports (`1-65535`) is very slow; start with common ports
  - Ensure that you are authorized to scan the target
parameters:
  - name: "target"
    type: "string"
    description: |
      Target IP, hostname, CIDR, or domain name; the host portion is extracted automatically from a URL.

      **Examples:** `192.168.1.1`, `10.0.0.0/24`, `example.com`
    required: true
    position: 1
    format: "positional"
  - name: "ports"
    type: "string"
    description: |
      Port range. Examples: `80`, `1-1000`, `80,443,8080`, `1-65535` (all-port scans are very slow)
    required: false
    flag: "-p"
    format: "flag"
  - name: "timing"
    type: "string"
    description: "Timing template T0-T5; larger numbers are faster. Example: `4` produces `-T4`"
    required: false
    format: "template"
    template: "-T{value}"
  - name: "nse_scripts"
    type: "string"
    description: "NSE scripts passed to `--script`. Examples: `vuln`, `http-title,http-headers`"
    required: false
    flag: "--script"
    format: "flag"
  - name: "os_detection"
    type: "bool"
    description: |
      Enable `-O` OS detection. **Requires root**; leave false when running without root.
    required: false
    flag: "-O"
    format: "flag"
    default: false
  - name: "aggressive"
    type: "bool"
    description: |
      Enable aggressive scanning with `-A` (includes OS detection). **Requires root**; leave false when running without root.
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "scan_type"
    type: "string"
    description: |
      Scan-type options; **when provided, these replace the default `-sT -sV -sC`**, leaving only the options you specify.
      Separate multiple options with spaces, for example: `-sT -sV` or `-sU` (UDP).
    required: false
    format: "template"
    template: "{value}"
  - name: "additional_args"
    type: "string"
    description: |
      Additional arguments appended to the command, separated by spaces.
      Examples: `--max-retries 3`, `-v`, `-Pn`
    required: false
    format: "positional"
