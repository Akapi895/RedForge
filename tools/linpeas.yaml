name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux privilege-escalation enumeration script that automatically detects common escalation paths"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege-escalation enumeration script used to detect common escalation paths on Linux systems.

  **Main features:**
  - System information gathering
  - Permission and group checks
  - Detection of writable files and directories
  - SUID/SGID file discovery
  - Environment-variable checks
  - Scheduled-task analysis
  - Network configuration checks
  - Sensitive-file discovery

  **Use cases:**
  - Privilege escalation during penetration testing
  - Security audits
  - Post-exploitation testing
  - CTF competitions

  **Notes:**
  - The linpeas.sh script must already be downloaded on the target system
  - Execution may take a long time
  - Output can be extensive; saving it to a file is recommended
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Fast mode; skips time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional LinPEAS arguments. Used to pass LinPEAS options not defined in the parameter list.

      **Example values:**
      - Add common argument examples according to the tool's features

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
