name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used in the tool list to reduce token usage)

short_description: "System command execution tool for running shell commands and system operations (use with caution)"
# Detailed tool description

description: |
  A system command execution tool for running shell commands and system operations.

  **Main features:**
  - Execute arbitrary shell commands
  - Support shells such as bash and sh
  - Specify a working directory
  - Return command execution results

  **Use cases:**
  - System administration and maintenance
  - Automated script execution
  - File operations and processing
  - System information gathering

  **Security warnings:**
  - ⚠️ This tool can execute arbitrary system commands and therefore presents a security risk
  - ⚠️ Use it only in a controlled environment
  - ⚠️ All command executions are logged
  - ⚠️ Restrict the range of commands that may be executed
  - ⚠️ Do not execute untrusted commands
# Parameter definitions

parameters:
  - name: "command"
    type: "string"
    description: |
      System command to execute. It may be any valid shell command.

      **Format requirements:**
      - A complete shell command
      - May contain shell features such as pipelines and redirection
      - Environment variables are supported

      **Example values:**
      - Simple command: "ls -la"
      - With a pipeline: "ps aux | grep nginx"
      - File operation: "cat /etc/passwd"
      - Network command: "curl http://example.com"
      - System information: "uname -a"
      - Find files: "find /var/log -name '*.log'"

      **Notes:**
      - The command is executed in the specified shell
      - Ensure that the command syntax is correct
      - Consider the command's security impact
      - This parameter is required and cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      Shell type to use; defaults to sh.

      **Available values:**
      - sh: Standard shell (default)
      - bash: Bash Shell
      - zsh: Z Shell
      - Other shells available on the system

      **Example values:**
      - "sh" (default)
      - "bash"
      - "zsh"

      **Notes:**
      - Ensure that the specified shell is available on the system
      - Command syntax may differ slightly between shells
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      Working directory for command execution. The current working directory is used when omitted.

      **Format requirements:**
      - An absolute or relative path
      - The directory must exist

      **Example values:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **Notes:**
      - Ensure that the directory exists and is accessible
      - Relative paths are resolved from the program's working directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional exec arguments. Used to pass exec options not defined in the parameter list.

      **Example values:**
      - Add common argument examples according to the tool's features

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
