name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget search tool"
description: |
  ROPgadget is a tool for searching binaries for ROP gadgets.

  **Main features:**
  - ROP gadget search
  - Support for multiple architectures
  - Gadget classification
  - Exploit-chain generation

  **Use cases:**
  - Binary analysis
  - Exploit development
  - ROP chain construction
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ROPgadget arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
