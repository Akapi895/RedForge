name: "nikto"
command: "nikto"
enabled: true
# Allowed exit codes: Nikto returns exit code 1 when it finds vulnerabilities; this is a normal successful state

allowed_exit_codes: [1]
# Short description (used in the tool list to reduce token usage)

short_description: "Web server scanner for detecting known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description

description: |
  A web server scanner used to detect known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Main features:**
  - Detect web server versions and configuration issues
  - Identify known web vulnerabilities and CVEs
  - Detect dangerous files and directories
  - Check for server misconfigurations
  - Identify outdated software versions
  - Detect default files and scripts

  **Use cases:**
  - Web application security assessments
  - Server configuration audits
  - Vulnerability scanning and discovery
  - Early-stage information gathering for penetration testing

  **Notes:**
  - Scans may generate large volumes of logs; manage logs appropriately
  - Some scans may trigger WAF or IDS alerts
  - Use only within an authorized scope
  - Scan results require manual verification
# Parameter definitions

parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. This may be a complete URL or an IP address.

      **Format requirements:**
      - May include a scheme (http:// or https://)
      - May contain only an IP address or domain name
      - If only an IP is provided, HTTP is used by default

      **Example values:**
      - Complete URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP address: "192.168.1.1"
      - With a port: "http://example.com:8080"
      - With a path: "http://example.com/admin"

      **Notes:**
      - If only an IP is provided, the tool uses HTTP
      - Providing a complete URL is recommended to ensure correct scanning
      - This parameter is required and cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Nikto arguments. Used to pass Nikto options not defined in the parameter list.

      **Example values:**
      - Add common argument examples according to the tool's features

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
