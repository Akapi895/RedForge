name: "volatility3"
command: "volatility3"
enabled: true
short_description: "Volatility 3 memory forensics analysis tool"
description: |
  Volatility 3 is the next generation of the Volatility framework and is used for memory forensics analysis.

  **Main features:**
  - Memory dump analysis
  - Advanced plugin system
  - Improved performance
  - Improved documentation

  **Use cases:**
  - Memory forensics
  - Malware analysis
  - Incident response
  - Digital forensics
parameters:
  - name: "memory_file"
    type: "string"
    description: "Memory dump file path"
    required: true
    flag: "-f"
    format: "flag"
  - name: "plugin"
    type: "string"
    description: "Volatility 3 plugin to execute"
    required: true
    position: 0
    format: "positional"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Volatility 3 arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
