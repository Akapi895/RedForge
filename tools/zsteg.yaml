name: "zsteg"
command: "zsteg"
enabled: true
short_description: "LSB steganography detection tool for finding hidden data in PNG/BMP images"
description: |
  zsteg is a tool for detecting LSB (Least Significant Bit) steganography in PNG and BMP images.

  **Main features:**
  - LSB steganography detection
  - Support for multiple steganographic algorithms
  - Automatic extraction of hidden data
  - Support for multiple image formats

  **Use cases:**
  - CTF steganography challenges
  - Image steganography analysis
  - Digital forensics
  - Security research

  **Notes:**
  - Requires a Ruby environment
  - Supports PNG and BMP formats
  - Can detect multiple steganographic algorithms
parameters:
  - name: "file"
    type: "string"
    description: "Path to the image file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "all"
    type: "bool"
    description: "Detect all possible steganographic methods"
    required: false
    flag: "--all"
    format: "flag"
  - name: "lsb"
    type: "bool"
    description: "Detect only LSB steganography"
    required: false
    flag: "--lsb"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional zsteg arguments. Used to pass zsteg options not defined in the parameter list.

      **Example values:**
      - Add common argument examples according to the tool's features

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure arguments are formatted correctly to avoid command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
