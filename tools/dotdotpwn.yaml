name: "dotdotpwn"
command: "dotdotpwn"
enabled: true
short_description: "Directory traversal vulnerability testing tool"
description: |
  DotDotPwn is a directory traversal vulnerability testing tool supporting multiple protocols.

  **Main features:**
  - Directory traversal testing
  - Multiple protocol support(HTTP, FTP, TFTP, etc.)
  - Automated testing
  - Report generation

  **Use cases:**
  - Directory traversal vulnerability testing
  - Web application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "Target hostname or IP"
    required: true
    flag: "-h"
    format: "flag"
  - name: "module"
    type: "string"
    description: "Module to use(http, ftp, tftp, etc.)"
    required: false
    flag: "-m"
    format: "flag"
    default: "http"
  - name: "additional_args"
    type: "string"
    description: |
      Additional dotdotpwn arguments. Use this to pass dotdotpwn options not defined in the parameter list.

      **Example values:**
      - Add commonly used arguments according to the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
