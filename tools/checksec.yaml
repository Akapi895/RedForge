name: "checksec"
command: "checksec"
enabled: true
short_description: "Binary security-feature checking tool"
description: |
  Checksec checks security features of binary files.

  **Main features:**
  - Security-feature checks
  - Protection-mechanism detection
  - Support for multiple architectures
  - Detailed reports

  **Use cases:**
  - Binary security analysis
  - Protection-mechanism checks
  - Vulnerability research
  - Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to check"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checksec arguments. Use this to pass checksec options not defined in the parameter list.

      **Example values:**
      - Add commonly used arguments according to the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
