name: "msfvenom"
command: "msfvenom"
enabled: true
short_description: "Metasploit payload generation tool"
description: |
  MSFVenom is the Metasploit Framework's payload generation tool for creating various types of payloads.

  **Main features:**
  - Multiple payload types
  - Encoder support
  - Multiple output formats
  - Multiple platform support

  **Use cases:**
  - Penetration testing
  - Payload generation
  - Exploitation
  - Security testing
parameters:
  - name: "payload"
    type: "string"
    description: "Payload to generate (e.g. windows/meterpreter/reverse_tcp)"
    required: true
    flag: "-p"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "Output format (exe, elf, raw, etc.)"
    required: false
    flag: "-f"
    format: "flag"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "encoder"
    type: "string"
    description: "Encoder (e.g. x86/shikata_ga_nai)"
    required: false
    flag: "-e"
    format: "flag"
  - name: "iterations"
    type: "string"
    description: "Encoding iteration count"
    required: false
    flag: "-i"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional MSFVenom arguments for options not defined in the parameter list.

      **Example values:**
      - Add common argument examples based on the tool's capabilities

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to prevent command injection
      - These arguments are appended directly to the end of the command
    required: false
    format: "positional"
